[project]
name = "supportiq-backend"
version = "0.1.0"
description = "SupportIQ API: FastAPI backend for the uncertainty-aware AI support platform."
requires-python = ">=3.12"
# Lower bounds only; exact versions are pinned in uv.lock (commit it).
dependencies = [
    # --- Web framework ---
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33", # form + file uploads (OAuth2 login form, document upload)
    "email-validator>=2.3.0",   # pydantic EmailStr
    # --- Database ---
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    # --- Auth ---
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    # --- Infrastructure ---
    "redis>=8.1.0",          # rate limiting, real-time events, Celery broker
    "aiosmtplib>=5.1.3",     # outgoing email (invitations)
    "celery[redis]>=5.7.0",  # background jobs (document ingestion)
    "boto3>=1.44.0",         # S3-compatible object storage (original documents)
    # --- Knowledge base ---
    "pypdf[crypto]>=7.0.1",  # PDF text, page by page; crypto: AES "permissions-only" PDFs
    "python-docx>=1.2.0",    # DOCX text extraction
    "fastembed>=0.9.1",      # BGE embeddings on ONNX Runtime (no PyTorch)
    "qdrant-client>=1.20.0", # vector index
    "rapidocr>=3.10.0",      # OCR for scanned PDF pages (models bundled, ONNX Runtime)
    "pypdfium2>=5.15.2",     # renders PDF pages to images for OCR
    # --- Answer generation ---
    "httpx2>=2.16.0",        # Ollama's HTTP API (local models); also FastAPI's TestClient
    "anthropic>=2.8.0",      # Claude, when LLM_PROVIDER=anthropic
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Tests use Qdrant's in-memory mode, where payload indexes are no-ops.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
