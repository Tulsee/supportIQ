# Local development infrastructure. Start with:  docker compose up -d
# Services are bound to 127.0.0.1 only, so dev credentials are never exposed on the LAN.
# Connect via 127.0.0.1, not "localhost" (on Windows, localhost tries IPv6 first: ~2s stall).

name: supportiq

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportiq}
      POSTGRES_DB: ${POSTGRES_DB:-supportiq}
    ports:
      # Host port 5433: 5432 is taken by a native PostgreSQL service on the dev machine.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - postgres_data:/var/lib/postgresql
      # Runs once, on first initialization of an empty volume.
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # cache/limits only: no persistence
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches all outgoing email in development. Web UI: http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # Vector index for knowledge-base chunks. Dashboard: http://127.0.0.1:6433/dashboard
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      # Host port 6433: 6333 is often taken by other local Qdrant instances.
      - "127.0.0.1:${QDRANT_PORT:-6433}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # S3-compatible object storage for original documents. RustFS, because MinIO no
  # longer publishes container images. Console: http://127.0.0.1:9001
  object-storage:
    image: rustfs/rustfs:1.0.5
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-supportiq}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-supportiq-dev-secret}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object_data:/data

volumes:
  postgres_data:
  qdrant_data:
  object_data:
